<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My first website</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <style>
    *{
    text-align:center;
    background-color:aquamarine;
}
#number{
    font-size:50px;
    color:blue;
    font-weight:bold;
    font-size:7em;
    text-transform:uppercase;
}
#roll{
    font-size:2.5em;
    color:blueviolet;
    font-weight:bold;  
}
button{
    font-size:2em;
    color:blue;
    font-weight:bold;
    background-color:lightblue;
    border-radius:10px;
    border:none;
    padding:10px 20px;
    cursor:pointer;
}
button:hover{
    background-color:lightcoral;
    color:white;
}
#roll:hover{
    background-color:lightcoral;
    color:white;
}
#number2{
    font-size:50px;
    color:blue;
    font-weight:bold;
    font-size:7em;
    text-transform:uppercase;
}
#win{
    font-size:2.5em;
    color:rgb(88, 31, 142);
    font-weight:bold;    
}
@keyframes roll{
    0%{
        transform:rotate(0deg);
    }
    100%{
        transform:rotate(360deg);
    }
}
  </style>
</head>
<body>
  <header>
    <h1>Can you beat me & get 6 6 in this two dices ! 👌</h1>
  </header>
  <main>
    <h1 id="number">0</h1>
    <h1 id="number2">0</h1>
    <label for="roll"></label>
    <button id="roll">Roll</button>
  </main>
  <footer>
    <h1 id="win"></h1>
  </footer>
  <script>
  document.getElementById(`roll`).onclick = function() {
    let value = Math.floor(Math.random()*6)+1;
    let value2 = Math.floor(Math.random()*6)+1;
    document.getElementById(`number`).textContent = value;
    document.getElementById(`number2`).textContent = value2;
    if(value==6 && value2==6){
        document.getElementById(`win`).textContent = `Congratulation You win! 🎉`;
    }else{
        document.getElementById(`win`).textContent = `You lose Try Again! 😒`;
    }
}
</script>
</body>
</html>
